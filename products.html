<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - AL-WAHA | Make Joy Happen</title>
  <meta name="description" content="Explore AL-WAHA's full range of premium vape products.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow-x: clip; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 2px;
      width: 100%;
    }
    @media (max-width: 640px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 1px; }
    }
    .gallery-item {
      position: relative; overflow: hidden; border-radius: 12px; cursor: pointer;
      aspect-ratio: 1/1; background: var(--bg-secondary);
      transition: transform .3s, box-shadow .3s;
    }
    .gallery-item:hover { transform: scale(1.02); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .gallery-item img { width:100%; height:100%; object-fit:cover; transition: transform .4s; }
    .gallery-item:hover img { transform: scale(1.05); }
    .gallery-empty { text-align:center; padding:40px 16px; color:var(--text-secondary); display:none; }
    .gallery-empty .icon { font-size:3rem; margin-bottom:8px; }

    .lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.92); z-index:9999; align-items:center; justify-content:center; }
    .lightbox.active { display:flex; }
    .lightbox img { max-width:92vw; max-height:92vh; border-radius:12px; }
    .lightbox-close { position:absolute; top:24px; right:32px; font-size:2rem; color:#fff; cursor:pointer; background:none; border:none; }
    .lightbox-prev, .lightbox-next { position:absolute; top:50%; transform:translateY(-50%); font-size:2.5rem; color:#fff; cursor:pointer; background:none; border:none; padding:16px; opacity:.7; }
    .lightbox-prev { left:8px; } .lightbox-next { right:8px; }
  </style>
</head>
<body data-page="products">

  <div id="age-modal-container"></div>
  <div id="navbar-container"></div>

  <div class="page-header">
    <div class="container">
      <h1 data-cms="products._pageTitle" data-cms-auto-gradient>Our Products</h1>
      <p data-cms="products._pageDesc">Discover the full range of AL-WAHA premium vaping devices.</p>
    </div>
  </div>

  <!-- Tabs -->
  <section style="padding: var(--space-xl) 0 0 0;">
    <div class="container">
      <div class="filter-bar" style="justify-content: center;">
        <div class="filter-tags" id="filterTags">
          <button class="filter-tag active" data-filter="all">All Products</button>
          <button class="filter-tag" data-filter="100K">100K</button>
          <button class="filter-tag" data-filter="200K">200K</button>
          <button class="filter-tag" data-filter="250K">250K</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Gallery -->
  <section id="gallerySection">
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="gallery-empty" id="galleryEmpty"><div class="icon">🖼️</div><p>No images yet — upload from <a href="admin/gallery.html">admin gallery</a></p></div>
  </section>

  <!-- Product Cards -->
  <section style="padding: var(--space-xl) 0 var(--space-3xl) 0;">
    <div class="container" id="productsContainer"></div>
    <div id="noResults" style="display:none;text-align:center;padding:80px 0;">
      <div style="font-size:3rem;margin-bottom:16px;">🔍</div>
      <h3>No products found</h3>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-prev" onclick="navigateLightbox(-1)">‹</button>
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox-next" onclick="navigateLightbox(1)">›</button>
  </div>

  <div id="footer-container"></div>

  <script src="js/content-store.js"></script>
  <script src="js/components.js"></script>
  <script>
    var currentFilter = 'all';
    var galleryImages = [];
    var allProducts = [];

    // ====== GALLERY ======
    (function loadGallery() {
      var url = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? 'http://localhost:3001/api/product-gallery' : '/api/product-gallery';
      fetch(url).then(function(r) { return r.ok ? r.json() : []; }).then(function(imgs) {
        galleryImages = imgs;
        renderGallery();
      }).catch(function() { galleryImages = []; renderGallery(); });
    })();

    function renderGallery() {
      var imgs = currentFilter === 'all' ? galleryImages : galleryImages.filter(function(i) { return i.category === currentFilter; });
      var grid = document.getElementById('galleryGrid');
      var empty = document.getElementById('galleryEmpty');
      if (!imgs.length) { grid.style.display = 'none'; empty.style.display = 'block'; return; }
      grid.style.display = 'grid'; empty.style.display = 'none';
      window._galleryImages = imgs;
      grid.innerHTML = imgs.map(function(img, idx) {
        return '<div class="gallery-item" onclick="openLightbox(' + idx + ')"><img src="' + img.image + '" alt="" loading="lazy"></div>';
      }).join('');
    }

    // ====== PRODUCTS ======
    (function loadProducts() {
      CMS.init().then(function() { CMS.applyToPage(); }).catch(function(){});
      CMS.getAllProducts().then(function(prods) {
        allProducts = prods;
        renderProducts();
      }).catch(function() { allProducts = []; renderProducts(); });
    })();

    function renderProducts() {
      var filtered = currentFilter === 'all' ? allProducts : allProducts.filter(function(p) { return p.category === currentFilter; });
      var container = document.getElementById('productsContainer');
      var noResults = document.getElementById('noResults');
      if (!filtered.length) { container.style.display = 'none'; noResults.style.display = 'block'; return; }
      container.style.display = 'block'; noResults.style.display = 'none';
      var map = {};
      filtered.forEach(function(p) { var s = p.series || 'Other'; if (!map[s]) map[s] = []; map[s].push(p); });
      var order = ['Gear','Star','Vista','Rave','Neon','Ace','Nex','Joygo','Switch','Magic'];
      var names = Object.keys(map).sort(function(a,b) { return (order.indexOf(a)===-1?999:order.indexOf(a)) - (order.indexOf(b)===-1?999:order.indexOf(b)); });
      var h = '';
      names.forEach(function(s) {
        h += '<div class="series-section"><div class="series-header"><h2 class="series-name">'+s+' Series</h2><span class="series-count">'+map[s].length+' product(s)</span></div><div class="product-grid">';
        h += map[s].map(function(p) {
          return '<div class="product-card reveal" onclick="location.href=\'product-detail.html?id='+p.id+'\'">'+
            (p.badge?'<div class="product-badge">'+p.badge+'</div>':'')+
            '<div class="product-image">'+(p.image&&(p.image.match(/^https?:\/\//)||p.image.match(/^data:/)||p.image.match(/^\//))?'<img src="'+p.image+'" alt="'+p.name+'" loading="lazy">':'<div class="product-visual" style="background:'+(p.gradient||'linear-gradient(135deg,#667eea,#764ba2)')+';">'+(p.image||p.name.charAt(0))+'</div>')+'</div>'+
            '<div class="product-info"><div class="product-category">'+p.category+'</div><h3 class="product-name">'+p.name+'</h3><div class="product-meta"><span class="product-puffs">'+((p.specs&&p.specs.puffs)||p.puffs||'')+'</span><span class="product-link">Learn More →</span></div></div></div>';
        }).join('');
        h += '</div></div>';
      });
      container.innerHTML = h;
      setTimeout(function() { if (window.initScrollReveal) initScrollReveal(); }, 100);
    }

    // ====== TABS ======
    document.getElementById('filterTags').addEventListener('click', function(e) {
      var btn = e.target.closest('.filter-tag');
      if (!btn) return;
      document.querySelectorAll('#filterTags .filter-tag').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderGallery();
      renderProducts();
    });

    // ====== LIGHTBOX ======
    var lbIdx = 0;
    window.openLightbox = function(idx) {
      if (!window._galleryImages || !window._galleryImages.length) return;
      lbIdx = idx;
      document.getElementById('lightboxImg').src = window._galleryImages[idx].image;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    };
    window.closeLightbox = function() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    };
    window.navigateLightbox = function(dir) {
      if (!window._galleryImages || !window._galleryImages.length) return;
      lbIdx = (lbIdx + dir + window._galleryImages.length) % window._galleryImages.length;
      document.getElementById('lightboxImg').src = window._galleryImages[lbIdx].image;
    };
    document.addEventListener('keydown', function(e) {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
      if (e.key === 'ArrowRight') navigateLightbox(1);
    });
  </script>
</body>
</html>
